name: Build Linux App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix:
        include:
          - arch: amd64
            electron_arch: x64
          - arch: arm64
            electron_arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26.0.0

      - name: Lock npm version
        run: npm i -g npm@11.12.1

      - name: Install Frontend Dependencies
        run: |
          npm install

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Install Backend Dependencies
        run: |
          cd src-go
          go mod tidy

      - name: Get Latest Geo Data
        run: |
          wget -O src-go/internal/em/geoip.metadb https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
          wget -O src-go/internal/em/GeoSite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          wget -O src-go/internal/em/GeoLite2-ASN.mmdb https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

      - name: Get Tag Version
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Backend for ${{ matrix.arch }}
        shell: pwsh
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: |
          cd src-go
          go build -tags=with_gvisor -trimpath `
            -ldflags "-s -w -X github.com/snakem982/pandora-box/api.Version=$env:VERSION" `
            -o px

      - name: Sync VERSION to package.json
        run: node build/sync-version.js

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Build Frontend for ${{ matrix.arch }}
        shell: pwsh
        run: |
          npm run make -- --linux deb rpm --${{ matrix.electron_arch }}

      - name: Normalize Linux artifact names
        shell: pwsh
        run: |
          foreach ($extension in @("deb", "rpm")) {
            $artifact = Get-ChildItem -Path "out" -Filter "*.$extension" -File
            if ($artifact.Count -ne 1) {
              throw "Expected exactly one .$extension artifact in out, found $($artifact.Count)"
            }
            Move-Item -LiteralPath $artifact[0].FullName -Destination "out/Pandora-Box-${{ env.VERSION }}-linux-${{ matrix.arch }}.$extension" -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: false
          prerelease: true
          files: |
            out/Pandora-Box-${{ env.VERSION }}-linux-${{ matrix.arch }}.deb
            out/Pandora-Box-${{ env.VERSION }}-linux-${{ matrix.arch }}.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
